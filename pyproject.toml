[project]
name = "touro-shorts"
version = "0.1.0"
description = "AI editing assistant for capoeira video editors: brand-styled, movement-timed Instagram shorts"
readme = "README.md"
license = "CC-BY-4.0"
license-files = ["LICENSE", "src/touro_shorts/fonts/OFL.txt"]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "pillow>=13.0",
]

[project.scripts]
touro-shorts = "touro_shorts.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=9.2.0",
    "ruff>=0.14",
    "vulture>=2.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]  # pycodestyle, pyflakes, import order, bugbear, modern syntax, complexity

[tool.ruff.lint.mccabe]
max-complexity = 12  # today's most complex function (models.problems); lower it, never raise it

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80  # dead code: unused functions, imports, variables
