[project]
name = "insta-shorts"
version = "0.1.0"
description = "Brand-styled, movement-timed text cards for Simplesmente Capoeira Instagram shorts"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "pillow>=13.0",
]

[tool.uv]
package = false  # a script project: run with `uv run shorts.py ...`, nothing to build or install

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
